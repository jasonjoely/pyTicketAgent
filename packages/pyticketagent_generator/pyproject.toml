[project]
name = "pyticketagent-generator"
version = "0.1.0"
description = "CLI that generates sample incident ticket JSON"
requires-python = ">=3.12"
dependencies = [
    "pyticketagent-core",
    "faker>=33.0",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "types-faker",
]

[project.scripts]
pyticketagent-generator = "pyticketagent_generator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyticketagent_generator"]

[tool.hatch.build.targets.wheel.force-include]
"src/pyticketagent_generator/resources" = "pyticketagent_generator/resources"

[tool.uv.sources]
pyticketagent-core = { workspace = true }