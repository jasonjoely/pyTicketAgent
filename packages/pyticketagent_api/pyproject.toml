[project]
name = "pyticketagent-api"
version = "0.1.0"
description = "FastAPI REST API for pyTicketAgent"
requires-python = ">=3.12"
dependencies = [
    "pyticketagent-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyticketagent_api"]

[tool.uv.sources]
pyticketagent-core = { workspace = true }