[project]
name = "pyticketagent-core"
version = "0.1.0"
description = "Shared models, data access, and AI helpers for pyTicketAgent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "asyncpg>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyticketagent_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/pyticketagent_core/resources" = "pyticketagent_core/resources"
